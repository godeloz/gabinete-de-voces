<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El gabinete de voces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#E9E9E2;
  --papel-alto:#F2F2EC;
  --tinta:#1B2432;
  --tinta-suave:#3E4A5C;
  --grafito:#767C86;
  --pauta:#BCBBB1;
  --lapiz:#B8352C;
  --azul:#2E5C8A;
  --verde:#4A6F52;
  --sombra:0 1px 0 rgba(27,36,50,.06), 0 8px 24px -14px rgba(27,36,50,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:'Spectral',Georgia,serif;
  font-size:16.5px;
  line-height:1.62;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:26px 20px 96px}

/* ---------- tipografía ---------- */
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:400;margin:0;line-height:1.14;letter-spacing:-.012em}
h1{font-size:2.15rem}
h2{font-size:1.6rem}
h3{font-size:1.18rem}
p{margin:0 0 .95em}
em{font-style:italic}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

.rotulo{
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.19em;
  text-transform:uppercase;color:var(--grafito);margin:0 0 12px;display:block;font-weight:500
}
.pie{
  font-size:.86rem;line-height:1.5;color:var(--grafito);
  border-left:2px solid var(--pauta);padding:2px 0 2px 13px;margin:22px 0 0
}
.pie strong{color:var(--tinta-suave);font-weight:600}
.lead{font-size:1.06rem;color:var(--tinta-suave)}
.centro{text-align:center}

/* ---------- reglas / pentagrama decorativo ---------- */
.pauta-sep{height:13px;margin:26px 0;background-image:repeating-linear-gradient(to bottom,var(--pauta) 0 1px,transparent 1px 4px);opacity:.75}

/* ---------- botones ---------- */
.btn{
  display:block;width:100%;border:none;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;
  padding:16px 18px;border-radius:2px;background:var(--tinta);color:var(--papel-alto);
  transition:background .18s ease, transform .12s ease;font-weight:500
}
.btn:hover{background:#2b3849}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--pauta);color:#8b8a80;cursor:not-allowed}
.btn.fantasma{background:transparent;color:var(--tinta-suave);border:1px solid var(--pauta)}
.btn.fantasma:hover{background:rgba(27,36,50,.045)}
.btn.rojo{background:var(--lapiz)}
.btn.rojo:hover{background:#9c2b23}
.btn+.btn{margin-top:9px}
.btn-fila{display:flex;gap:9px}
.btn-fila .btn{margin-top:0}
:focus-visible{outline:2px solid var(--azul);outline-offset:3px}

/* ---------- gabinete ---------- */
.gab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:20px}
@media(min-width:620px){.gab-grid{grid-template-columns:repeat(3,1fr);gap:14px}}
.gab-card{
  background:var(--papel-alto);border:1px solid var(--pauta);border-radius:2px;
  padding:15px 13px 13px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  display:flex;flex-direction:column;gap:9px;min-height:172px
}
.gab-card:hover{border-color:var(--tinta-suave);box-shadow:var(--sombra);transform:translateY(-2px)}
.gab-card .nom{display:block;font-family:'Fraunces',serif;font-size:1.2rem;line-height:1.05}
.gab-card .obs{display:block;font-size:.79rem;line-height:1.42;color:var(--grafito);font-style:italic;flex:1}
.gab-card.elegida{border-color:var(--tinta);border-width:2px;padding:14px 12px 12px}

/* ---------- pentagrama de ejes ---------- */
.staff{width:100%;display:block}
.staff .linea{stroke:var(--pauta);stroke-width:1}
.staff .cabeza{fill:var(--tinta)}
.staff .cabeza-hueca{fill:none;stroke:var(--tinta);stroke-width:1.6}
.staff .silencio{fill:var(--lapiz)}
.staff .et{font-family:'IBM Plex Mono',monospace;font-size:7.4px;letter-spacing:.09em;fill:var(--grafito);text-transform:uppercase}
.staff .et-cero{fill:var(--lapiz)}

/* ---------- ficha ---------- */
.ficha-cab{border-bottom:1px solid var(--pauta);padding-bottom:16px;margin-bottom:18px}
.ficha-cab h2{margin-bottom:6px}
.ficha-cab .sub{font-style:italic;color:var(--grafito);font-size:.95rem}
.bloque{margin:22px 0}
.bloque .rotulo{margin-bottom:7px}
.bloque.desafina{background:rgba(184,53,44,.055);border-left:2px solid var(--lapiz);padding:14px 15px;margin-left:-2px}
.bloque.desafina .rotulo{color:var(--lapiz)}
.afina-lista{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.06em;
  border:1px solid var(--pauta);border-radius:999px;padding:5px 11px;color:var(--tinta-suave);background:var(--papel-alto)
}

/* ---------- código ---------- */
.codigo-grande{
  font-family:'IBM Plex Mono',monospace;font-size:3.7rem;letter-spacing:.09em;
  font-weight:500;line-height:1;margin:6px 0 10px
}

/* ---------- entradas ---------- */
.tam-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 6px}
.tam-btn{
  font-family:'IBM Plex Mono',monospace;font-size:1.15rem;padding:14px 0;border:1px solid var(--pauta);
  background:var(--papel-alto);color:var(--tinta);border-radius:2px;cursor:pointer;transition:all .15s ease
}
.tam-btn:hover{border-color:var(--tinta-suave)}
.tam-btn.on{background:var(--tinta);color:var(--papel-alto);border-color:var(--tinta)}
.cod-lista{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.cod-fila{display:flex;align-items:center;gap:11px}
.cod-fila .num{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--grafito);width:16px;flex-shrink:0}
.cod-input{
  flex:1;font-family:'IBM Plex Mono',monospace;font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase;
  padding:12px 14px;border:1px solid var(--pauta);background:var(--papel-alto);color:var(--tinta);border-radius:2px;width:100%
}
.cod-input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 2px rgba(46,92,138,.15)}
.cod-input.fija{background:transparent;border-style:dashed;color:var(--tinta-suave)}
.cod-input.mala{border-color:var(--lapiz);box-shadow:0 0 0 2px rgba(184,53,44,.14)}
.cod-fila .voz{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--grafito);width:66px;flex-shrink:0;text-align:right}
.aviso{font-size:.84rem;color:var(--lapiz);margin:10px 0 0;min-height:1.2em}

/* ---------- retrato ---------- */
.retrato{font-size:1.09rem;line-height:1.66}
.retrato .destacado{font-family:'Fraunces',serif;font-size:1.34rem;line-height:1.3;margin-bottom:14px;display:block}
.aviso-regla{
  border:1px solid var(--tinta);padding:19px 18px;margin:26px 0 0;background:var(--papel-alto)
}
.aviso-regla .rotulo{color:var(--tinta)}
.aviso-regla p{margin-bottom:.5em;font-size:.97rem}
.aviso-regla p:last-child{margin-bottom:0}

/* ---------- pieza ---------- */
.pieza-cab{margin-bottom:18px}
.situacion{
  background:var(--papel-alto);border:1px solid var(--pauta);border-left:3px solid var(--tinta);
  padding:17px 17px;font-size:.98rem;line-height:1.6;margin:16px 0 26px
}
.compas{
  border:1px solid var(--pauta);background:var(--papel-alto);border-radius:2px;
  padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .16s ease, box-shadow .16s ease;
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;font-family:inherit;color:inherit;font-size:inherit
}
.compas:hover{border-color:var(--tinta-suave)}
.compas .cifra{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.13em;color:var(--grafito);padding-top:4px;flex-shrink:0;width:30px}
.compas .cuerpo{flex:1}
.compas .tarea{display:block;font-size:.97rem;line-height:1.48;margin-bottom:9px}
.compas .casilla{
  display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--pauta);border-radius:999px;
  padding:5px 13px;font-family:'IBM Plex Mono',monospace;font-size:.73rem;color:var(--grafito);letter-spacing:.06em
}
.compas.lleno{border-color:var(--tinta-suave)}
.compas.lleno .casilla{border-style:solid;border-color:var(--tinta);background:var(--tinta);color:var(--papel-alto)}
.pool{margin-top:26px;border-top:1px solid var(--pauta);padding-top:18px}
.pool-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.tarjeta{
  border:1px solid var(--pauta);background:var(--papel-alto);border-radius:2px;padding:9px 13px;
  font-family:'IBM Plex Mono',monospace;font-size:.76rem;letter-spacing:.05em;color:var(--tinta);
  display:flex;flex-direction:column;gap:2px;line-height:1.3;min-width:88px
}
.tarjeta .v{display:block;font-size:.66rem;color:var(--grafito);letter-spacing:.1em;text-transform:uppercase}
.tarjeta.usada{opacity:.32}
.tarjeta.atril{border-style:dashed;border-color:var(--lapiz)}
.tarjeta.atril .v{color:var(--lapiz)}
.contador{font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--grafito);letter-spacing:.08em;margin-top:16px}

/* ---------- hoja inferior ---------- */
.velo{position:fixed;inset:0;background:rgba(27,36,50,.44);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s ease}
.velo.on{opacity:1;pointer-events:auto}
.hoja{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--papel);
  border-top:2px solid var(--tinta);border-radius:6px 6px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,.3,1);max-height:82vh;overflow-y:auto;
  max-width:640px;margin:0 auto
}
.hoja.on{transform:translateY(0)}
.hoja h3{margin-bottom:5px}
.hoja .tarea-eco{font-size:.92rem;color:var(--grafito);font-style:italic;margin-bottom:16px}
.op{
  display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
  border:1px solid var(--pauta);background:var(--papel-alto);border-radius:2px;padding:13px 15px;margin-bottom:8px;
  cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.85rem;letter-spacing:.06em;color:var(--tinta)
}
.op:hover{border-color:var(--tinta-suave)}
.op .vz{font-size:.68rem;color:var(--grafito);text-transform:uppercase;letter-spacing:.1em}
.op.bloq{border-style:dashed;border-color:var(--lapiz);color:var(--lapiz)}

/* ---------- resultados ---------- */
.res{border-left:3px solid var(--pauta);padding:2px 0 2px 15px;margin-bottom:24px}
.res .enc{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.res .cf{font-family:'IBM Plex Mono',monospace;font-size:.67rem;letter-spacing:.13em;color:var(--grafito)}
.res .estado{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.res .quien{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--grafito);margin-bottom:8px;letter-spacing:.05em}
.res .cons{font-size:.96rem;line-height:1.56;margin:0}
.res.afinado{border-color:var(--azul)}
.res.afinado .estado{color:var(--azul)}
.res.casi{border-color:var(--grafito)}
.res.casi .estado{color:var(--grafito)}
.res.noentro{border-color:var(--lapiz);border-left-style:dashed}
.res.noentro .estado{color:var(--lapiz)}
.res.silencio{border-color:var(--lapiz)}
.res.silencio .estado{color:var(--lapiz)}

/* ---------- final ---------- */
.capa{margin:30px 0}
.capa h3{margin-bottom:10px;font-size:1.3rem}
.capa .cuerpo{font-size:1.02rem;line-height:1.64}
.capa .cuerpo p:last-child{margin-bottom:0}
.marca{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.06em;color:var(--grafito);
  border-top:1px solid var(--pauta);padding-top:9px;margin-top:12px;line-height:1.7
}
.cierre-pregunta{
  min-height:62vh;display:flex;flex-direction:column;justify-content:center;text-align:center
}
.cierre-pregunta .q{font-family:'Fraunces',serif;font-size:1.72rem;line-height:1.28;margin:22px 0}

/* ---------- convenciones y lectura ---------- */
.eje-cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ayuda{
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;
  background:transparent;border:1px solid var(--pauta);border-radius:999px;padding:5px 11px;
  color:var(--tinta-suave);cursor:pointer;flex-shrink:0;transition:all .15s ease
}
.ayuda:hover{border-color:var(--tinta);background:var(--papel-alto)}
.glf{width:26px;height:16px;display:block}
.conv{border-top:1px solid var(--pauta);margin-top:8px}
.conv-fila{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--pauta)}
.conv-g{flex-shrink:0;width:64px;padding-top:2px}
.conv-g.ejenom{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta);padding-top:3px}
.conv-t{font-size:.88rem;line-height:1.48;color:var(--tinta-suave)}
.conv-t strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tinta);font-weight:500;margin-bottom:2px}
.lectura{border-top:1px solid var(--pauta);margin-top:10px}
.lect{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--pauta)}
.lect-g{flex-shrink:0;width:28px;padding-top:3px}
.lect-c{flex:1}
.lect-e{display:flex;justify-content:space-between;align-items:baseline;gap:9px;
  font-family:'IBM Plex Mono',monospace;font-size:.71rem;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta)}
.lect-e b{font-weight:400;color:var(--grafito);letter-spacing:.06em;text-align:right;flex-shrink:0}
.lect-d{display:block;font-size:.87rem;line-height:1.45;color:var(--tinta-suave);margin-top:3px}
.lect.cero .lect-e{color:var(--lapiz)}
.lect.cero .lect-e b{color:var(--lapiz)}

/* ---------- señales, prácticas, recaps ---------- */
.bloque.entra{background:rgba(46,92,138,.055);border-left:2px solid var(--azul);padding:14px 15px;margin-left:-2px}
.bloque.entra .rotulo{color:var(--azul)}
.senales{margin:0;padding:0;list-style:none}
.senales li{position:relative;padding:0 0 0 20px;margin-bottom:8px;font-size:.94rem;line-height:1.45}
.senales li:last-child{margin-bottom:0}
.senales li::before{content:'';position:absolute;left:0;top:.58em;width:9px;height:6px;
  background:var(--azul);border-radius:60% 60% 60% 60%/70% 70% 70% 70%;transform:rotate(-18deg)}
.practicas{margin:0 0 14px;padding-left:0;list-style:none;counter-reset:pr}
.practicas li{counter-increment:pr;position:relative;padding-left:30px;margin-bottom:13px;line-height:1.55}
.practicas li::before{content:counter(pr);position:absolute;left:0;top:1px;
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--papel-alto);background:var(--tinta);
  width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.consejo{background:var(--papel-alto);border-left:2px solid var(--verde);padding:11px 14px;
  font-size:.92rem;line-height:1.52;color:var(--tinta-suave);margin:10px 0 4px}
.recaps{display:flex;flex-direction:column;gap:8px;margin:18px 0 8px}
.recap{border:1px solid var(--pauta);background:var(--papel-alto);padding:11px 14px;border-radius:2px}
.recap-t{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.recap-n{font-family:'Fraunces',serif;font-size:1.06rem;line-height:1.2}
.recap-d{font-size:.85rem;color:var(--grafito);margin-top:3px;line-height:1.4}
.cierre-q{text-align:center;padding:14px 0 30px}
.cierre-q .q{font-family:'Fraunces',serif;font-size:1.62rem;line-height:1.28;margin:14px 0}
.res .cf{font-family:'IBM Plex Mono',monospace}
.capa .cuerpo .cf{font-size:.66rem;letter-spacing:.12em;color:var(--grafito);text-transform:uppercase}

/* ---------- reinicio ---------- */
.reinicio{
  position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;
  font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;
  background:var(--papel-alto);border:1px solid var(--pauta);border-radius:999px;padding:8px 14px;
  color:var(--grafito);cursor:pointer;box-shadow:var(--sombra);transition:all .15s ease
}
.reinicio:hover{color:var(--lapiz);border-color:var(--lapiz)}

/* ---------- misc ---------- */
.oculto{display:none!important}
.aparece{animation:sube .42s cubic-bezier(.22,.68,.3,1) both}
@keyframes sube{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.tarde{animation:fade .8s ease .9s both}
.tarde2{animation:fade .8s ease 2.1s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="reinicio" onclick="pedirReinicio()">Reiniciar</button>
<div class="velo" id="velo" onclick="cerrarHoja()"></div>
<div class="hoja" id="hoja"></div>
<script>
/* ============ VOCES ============ */
const EJES = ['tesitura','agilidad','escucha','proyeccion','fundamento'];
const EJE_NOM = {fundamento:'Fundamento',proyeccion:'Proyección',escucha:'Escucha',agilidad:'Agilidad',tesitura:'Tesitura'};

const VOCES = {
 bajo:{n:'Bajo',l:'B',pl:'bajos',sub:'La voz que nadie aplaude y que todos extrañan cuando falta.',
  obs:'Que no se rompa lo que ya funciona.',
  lidera:'Dando piso. Su equipo sabe exactamente qué no va a cambiar mañana, y eso libera una cantidad de energía que nadie contabiliza. En una crisis la gente lo busca porque su voz no tiembla, y no por valiente: por lenta. Delega tarde y revisa dos veces. Cuando dice que algo está listo, está listo. Su gente rara vez se siente inspirada y casi nunca se siente en riesgo.',
  ejes:{fundamento:3,proyeccion:1,escucha:2,agilidad:0,tesitura:2},
  cero:'agilidad',
  busca:['Hay que saber qué se rompe si esto se mueve.','Alguien tiene que averiguar de qué depende qué.','La decisión de hoy deja un precedente que otro va a usar en seis meses.','Hay que acotar el costo real, incluido el que no aparece en el reporte.','Hay que dejar por escrito por qué se hizo así.'],
  desafina:'No puede cambiar de línea. Cuando la partitura se rompe a mitad de la obra, el bajo sigue en la nota que le tocaba. Confunde estabilidad con inmovilidad y se entera meses después, cuando ya es historia.',
  falta:'Nadie preguntó qué se rompía. Este coro decidió sin saber qué había debajo de lo que estaba moviendo.',
  afina:['Mezzo','Tenor'],
  afinaTxt:'Mezzo cubre el hueco que aparezca sin preguntar de quién era. Tenor empuja el primer movimiento. Un coro de puros bajos es un edificio muy sólido que nadie usa.',
  fuerte:'Problemas donde el error se paga tarde y caro: sistemas viejos con muchas dependencias, decisiones que sientan precedente, cifras que hay que acotar antes de moverse.',
  dificil:'Situaciones con reloj. Cuando la respuesta correcta de las nueve ya no sirve a las once, el bajo llega con el análisis terminado y el problema resuelto por otro.',
  cultiva:'Tu autoridad viene de que la gente confía en tu no. Eso te da un margen que casi nadie tiene: puedes equivocarte rápido una vez sin perder credibilidad, porque tu historial te cubre. Estás gastando ese margen en no usarlo.',
  practica:['Cuando algo urgente llegue a tu mesa, ponte un límite de tiempo antes de leerlo y decide dentro de ese límite con lo que tengas. Empieza por decisiones reversibles.','Antes de bloquear una propuesta, ofrece la versión más pequeña de ella que sí aceptarías. Cambia «no se puede» por «así sí».','Identifica a la persona más rápida de tu equipo y llévala contigo a las reuniones donde tú serías el freno.']},

 baritono:{n:'Barítono',l:'R',pl:'barítonos',sub:'La voz del medio, que traduce.',
  obs:'Que lo dicho arriba llegue abajo sin deformarse.',
  lidera:'Traduciendo. Toma la decisión estratégica y la convierte en algo que un equipo pueda hacer el lunes. Se mueve entre pisos: desayuna con la vicepresidencia, almuerza con la operación, y en ambas mesas habla el idioma de la mesa. Su equipo nunca recibe una instrucción que no entienda. Es el primero al que llaman cuando dos áreas dejaron de hablarse.',
  ejes:{fundamento:2,proyeccion:1,escucha:0,agilidad:2,tesitura:3},
  cero:'escucha',
  busca:['Lo mismo hay que contárselo a públicos que necesitan cosas distintas.','Dos áreas usan la misma palabra para cosas diferentes.','Hay que bajar una decisión a doscientas personas que no estuvieron en la reunión.','Alguien tiene que volver ejecutable lo que se aprobó.','El mensaje va a llegarle a un cliente, a un jefe y a un operario, y no puede ser el mismo texto.'],
  desafina:'Traduce tan bien que deja de oír. Convierte todo lo que llega en algo procesable, incluida la queja que no era procesable, incluido el silencio que significaba otra cosa. La disonancia le pasa por encima transformada en tarea.',
  falta:'Lo que este coro decidió salió en un solo idioma, y llegó completo a quien ya lo hablaba.',
  afina:['Contralto','Soprano'],
  afinaTxt:'Contralto oye exactamente lo que él filtra sin darse cuenta. Soprano define hacia dónde traducir. Un coro de puros barítonos ejecuta impecablemente la instrucción equivocada.',
  fuerte:'Problemas de despliegue y de coordinación: llevar una decisión a la red, hacer que dos equipos que hablan distinto trabajen juntos, comunicar un cambio a públicos con intereses opuestos.',
  dificil:'Problemas donde lo importante todavía no se ha dicho. Si nadie formuló el asunto de fondo, el barítono traduce con precisión un encargo equivocado.',
  cultiva:'Eres el que hace que las cosas pasen entre personas que no se entienden, y por eso todo el mundo te manda tareas. El riesgo no es que te sobrecargues: es que empieces a medir tu trabajo por cuántas cosas moviste y no por si valía la pena moverlas.',
  practica:['En cada reunión, antes de anotar la tarea, pregunta una vez «¿qué es lo que en realidad está pasando aquí?». Espera la respuesta completa antes de escribir.','Una vez por semana, habla con alguien de tu equipo sin agenda y sin convertir nada de lo que diga en un pendiente.','Cuando llegue una queja, sepárala en dos: la parte que se resuelve haciendo algo y la parte que solo pedía ser oída. Atiende las dos por separado.']},

 tenor:{n:'Tenor',l:'T',pl:'tenores',sub:'La voz que entra primero.',
  obs:'Que alguien dé el primer paso.',
  lidera:'Exponiéndose. Toma la posición antes de que sea segura, y esa exposición le da permiso al resto para moverse. Cuando el equipo está paralizado, el tenor rompe la parálisis con el cuerpo. Pide perdón más que permiso. Arrastra a gente que no sabía que estaba dispuesta a moverse. Su equipo avanza rápido y llega cansado.',
  ejes:{fundamento:1,proyeccion:3,escucha:0,agilidad:2,tesitura:2},
  cero:'escucha',
  busca:['Hay que decir algo incómodo antes de tener el informe completo.','Alguien tiene que pedir un permiso, una excepción o una autorización, y va a molestar.','Todos saben lo que hay que hacer y nadie lo propone.','Hay que llevarle un problema a un comité que no quiere oírlo.','La ventana se cierra, y esperar a estar seguro equivale a decidir que no.'],
  desafina:'Canta encima de los demás. No por competir: su volumen tapa. Sale de las reuniones convencido de que hubo acuerdo, y lo que hubo fue silencio. El costo de su ímpetu lo pagan personas que él nunca escuchó decir que no.',
  falta:'Nadie rompió la parálisis. Este coro esperó a estar seguro, y la seguridad llegó después que el problema.',
  afina:['Contralto','Bajo'],
  afinaTxt:'Contralto le dice lo que se calló mientras él hablaba. Bajo le pone piso a la carrera. Un coro de puros tenores es una habitación donde todos hablan y nadie tiene idea de qué está pasando.',
  fuerte:'Problemas atascados: hallazgos que nadie lleva arriba, autorizaciones que nadie pide, decisiones que llevan meses circulando en correos entre personas que ya están de acuerdo.',
  dificil:'Problemas cuyo dato clave todavía no apareció. El tenor mueve primero y descubre después que se movió sobre una lectura incompleta de la sala.',
  cultiva:'Tu valor es que la gente se mueve cuando tú te mueves. El costo es que dejas de recibir información: cuando alguien sabe que vas a arrancar de todos modos, se ahorra el desacuerdo. Terminas rodeado de gente que te sigue y no te corrige.',
  practica:['En cada decisión importante, pregunta explícitamente quién no está de acuerdo, y no hables hasta que alguien conteste. El silencio no es aprobación.','Habla de último en al menos una reunión por semana. Anota qué información aparece que no habría aparecido si hablabas primero.','Elige a una persona de tu equipo que te contradiga bien y pídele que lo haga en público, no en privado.']},

 contralto:{n:'Contralto',l:'C',pl:'contraltos',sub:'La voz grave que no se anuncia.',
  obs:'Lo que se está callando en esta reunión.',
  lidera:'Oyendo. Su equipo descubre que puede decir cosas que no diría en otra parte, y eso cambia la clase de información que le llega. Detecta el problema seis meses antes de que aparezca en un indicador. Hace pocas preguntas y las hace en el momento exacto. La gente sale de sus reuniones con la sensación de haber sido leída, que es distinta de haber sido escuchada.',
  ejes:{fundamento:2,proyeccion:0,escucha:3,agilidad:1,tesitura:2},
  cero:'proyeccion',
  busca:['Algo no cuadra y nadie lo ha dicho en voz alta.','Hay que averiguar la causa real, no la que explica los datos.','La respuesta está en hablar con personas y no en revisar un reporte.','Alguien sabe algo que nadie le ha preguntado.','El indicador dice una cosa y la realidad puede estar diciendo otra.'],
  desafina:'Tiene razón en privado. Vio venir la crisis, lo dijo en el pasillo, se lo comentó a dos personas, no lo puso en la mesa. Su lucidez muere en el lugar donde la formuló, y después de la crisis alguien dice que ya se sabía.',
  falta:'Nadie oyó la sala. Lo que no se dijo en voz alta no existió para este coro, y casi siempre había algo.',
  afina:['Tenor','Soprano','Mezzo'],
  afinaTxt:'Tenor y Soprano llevan su hallazgo a donde se decide. Mezzo convierte lo que oyó en un movimiento. Un coro de puras contraltos sabe todo lo que va a pasar y no evita nada.',
  fuerte:'Problemas mal formulados: cuando lo que se está resolviendo no es lo que está pasando. Patrones que ningún reporte agrega, causas compartidas que parecen casos aislados, conocimiento que vive en la cabeza de tres personas.',
  dificil:'Problemas donde el hallazgo hay que defenderlo. La contralto llega a la conclusión correcta y la deja en un documento que nadie abre.',
  cultiva:'Ves antes que los demás, y eso no sirve de nada si el que decide se entera después. Tu trabajo no termina cuando entiendes: termina cuando alguien con poder de decisión entendió también.',
  practica:['Cuando notes algo, ponte un plazo de setenta y dos horas para decirlo en un espacio donde se decida. El pasillo no cuenta.','Convierte tu hallazgo en una frase de quince palabras antes de la reunión. Si no cabe, todavía no está listo para ser dicho.','Pídele a alguien con voz fuerte que te acompañe a presentarlo la primera vez, y la segunda hazlo sola.']},

 mezzo:{n:'Mezzo',l:'Z',pl:'mezzos',sub:'La voz que se acomoda.',
  obs:'Que el hueco se cubra, sea cual sea el hueco.',
  lidera:'Cubriendo. Cuando el plan se rompe, ya está haciendo otra cosa. Su equipo no colapsa nunca, porque el mezzo absorbe el impacto con el cuerpo antes de que llegue a los demás. Aprende oficios nuevos en fines de semana. Es el primero en llegar a la sala del incidente y el último en irse, y en la reunión del lunes nadie menciona su nombre.',
  ejes:{fundamento:1,proyeccion:2,escucha:2,agilidad:3,tesitura:0},
  cero:'tesitura',
  busca:['El reloj corre y hay que hacer algo hoy.','El plan se rompió y alguien tiene que sostener la operación mientras se arregla.','Pasó lo que no estaba previsto.','Hay que responder antes de tener el cuadro completo.','Alguien se fue, algo se cayó, y hay un hueco abierto ahora mismo.'],
  desafina:'Cubre todo y no ocupa nada. Al cabo de dos años nadie sabe decir qué hace exactamente. Cuando llega el momento de asignarle un lugar propio no hay lugar: hay una lista de emergencias que atendió. Su versatilidad se paga con ausencia de registro.',
  falta:'Cuando la partitura se rompió, este coro siguió en la nota que le tocaba. Nadie cubrió el hueco que se abrió.',
  afina:['Bajo','Soprano','Contralto'],
  afinaTxt:'Cualquiera que tenga posición fija. Alguien tiene que sostener una línea para que el mezzo tenga desde dónde moverse. Un coro de puros mezzos resuelve todas las urgencias y no construye nada.',
  fuerte:'Problemas con reloj: incidentes, caídas, renuncias inesperadas, ventanas que se cierran, cualquier cosa donde la respuesta buena de mañana vale menos que la respuesta aceptable de hoy.',
  dificil:'Problemas que exigen que lo mismo llegue distinto a públicos distintos. El mezzo resuelve y sigue, y la explicación queda para después, que suele ser nunca.',
  cultiva:'Tu problema no es que hagas demasiado: es que lo que haces no deja huella con tu nombre. Cubrir huecos es indispensable y es invisible, y la invisibilidad se vuelve un techo alrededor del cuarto año.',
  practica:['Elige un territorio que sea tuyo y no lo sueltes por seis meses, aunque se abran huecos más urgentes al lado.','Cuando resuelvas una emergencia, escribe en tres líneas qué pasó y qué hiciste, y mándalo. No como reporte: como registro de que existió.','Antes de cubrir un hueco, pregunta de quién era. A veces la mejor jugada es que se note que estaba abierto.']},

 soprano:{n:'Soprano',l:'S',pl:'sopranos',sub:'La voz que llega arriba.',
  obs:'Que exista un lugar al cual ir.',
  lidera:'Dando dirección. Su equipo puede repetir en una frase lo que están haciendo y por qué, y eso los sostiene en semanas donde nada funciona. Convierte una intención vaga en algo que se puede desear. Habla en futuro con una naturalidad que a algunos les incomoda. Atrae gente buena y la pierde cuando el destino tarda demasiado en volverse camino.',
  ejes:{fundamento:0,proyeccion:3,escucha:1,agilidad:2,tesitura:2},
  cero:'fundamento',
  busca:['Hay que decir hacia dónde vamos para que la decisión tenga sentido.','La noticia es mala y alguien tiene que darla de frente.','Hay que sostener algo ante una junta que solo ve el número.','El equipo necesita una razón, no una instrucción.','Lo que se comunique decide si la gente se siente parte o se siente sobrante.'],
  desafina:'No sabe qué sostiene el piso donde está parada. Propone la migración sin conocer el sistema que va a migrar, anuncia el rumbo sin saber qué cuesta desmontar lo anterior. Su visión es correcta y flota; cuando toca aterrizarla, alguien más descubre que no había cómo.',
  falta:'Nadie nombró el destino. Este coro resolvió compases sin que existiera un lugar al cual ir.',
  afina:['Bajo','Barítono'],
  afinaTxt:'Bajo le dice qué se rompe si avanza. Barítono convierte su rumbo en algo ejecutable. Un coro de puras sopranos tiene una dirección espléndida y ningún camino.',
  fuerte:'Problemas donde el cómo se cuenta cambia lo que pasa: anuncios difíciles, decisiones impopulares, presupuestos que hay que defender, equipos que necesitan saber para qué está sirviendo su esfuerzo.',
  dificil:'Problemas de terreno. La soprano decide hacia dónde sin saber qué cuesta desmontar lo que hay, y el costo aparece cuando ya se anunció.',
  cultiva:'La gente te sigue porque le das una razón para hacerlo, y eso es escaso. Lo que te falta no es realismo: es la costumbre de preguntar qué sostiene el piso antes de anunciar el salto.',
  practica:['Antes de comprometer una fecha en público, siéntate una hora con quien conoce el sistema por dentro y hazle una sola pregunta: qué se rompe.','Por cada destino que anuncies, pide que alguien escriba los tres primeros pasos concretos. Si nadie puede, todavía no es un destino.','Aprende en detalle un proceso operativo al año. Uno solo, hasta el fondo.']}
};
const ORDEN_VOCES = ['bajo','baritono','tenor','contralto','mezzo','soprano'];
const POR_LETRA = {}; ORDEN_VOCES.forEach(k=>POR_LETRA[VOCES[k].l]=k);

const AMBITOS = [
{id:'cartera',nombre:'Cartera vencida',titulo:'Todos al mismo tiempo',ejeD:'fundamento',ejeS:'escucha',
 sit:'Trescientos cuarenta camioneros le deben plata al banco. Todos compraron su tractocamión a crédito entre 2022 y 2024, todos hacen la misma clase de ruta, y todos empezaron a atrasarse en el mismo trimestre. Ninguno tiene mal historial: hasta hace cinco meses pagaban puntual. Si el banco los trata como incumplidos y les quita los camiones, ellos pierden el trabajo y el banco termina con doscientos vehículos que no puede vender. Si no hace nada, la mora sigue subiendo y hay que apartar plata que nadie recupera. Todavía nadie ha preguntado qué les pasó a todos al mismo tiempo.',
 v:{
 3:[
  c('Averiguar por qué se atrasaron todos a la vez. La respuesta no está en el sistema de cobranza: está en lo que ellos hacen todos los días.','contralto','bajo','escucha',
   'Alguien llama a doce deudores y no pregunta por la cuota. Pregunta por la ruta. Aparece lo mismo doce veces: un peaje nuevo en el corredor del Magdalena que le agregó nueve horas y un tanqueo al viaje.',
   'Se cruzan los créditos con la base de matrículas y se confirma que el noventa por ciento opera el mismo corredor. La causa queda acotada, no explicada.',
   'Se trata cada caso por separado. Trescientas cuarenta gestiones de cobranza individuales sobre un problema que no era individual.'),
  c('Diseñar cómo se les cambian las condiciones del crédito sin dañar a los otros ochocientos transportadores del banco que sí están al día.','bajo','baritono','fundamento',
   'Se reestructura con período de gracia atado al flujo real de la ruta, sin tocar la calificación del sector completo. La provisión sube este trimestre y no arrastra a los otros ochocientos créditos de transporte que sí están sanos.',
   'Se reestructura en bloque con las mismas condiciones para los trescientos cuarenta. Funciona para la mayoría. Ciento diez quedan con una cuota que tampoco pueden pagar.',

  c('Convencer a un comité que ve el sector en rojo de aprobar esto igual, sabiendo que el indicador del trimestre va a verse mal.','tenor','soprano','proyeccion',
   'Se presenta el martes con lo que hay, se pide la excepción, se acepta que el indicador del trimestre va a verse mal. La reestructuración arranca en once días.',

   'Nadie lleva el tema al comité con la fuerza suficiente. La cartera sigue su curso normal y en el reporte anual el sector transporte aparece como decisión de originación fallida.')],
 4:[
  c('Averiguar por qué se atrasaron todos a la vez, hablando con ellos en vez de mirar el reporte.','contralto','mezzo','escucha',
   'Doce llamadas y una pregunta que no era sobre la cuota. El peaje del Magdalena aparece doce veces.',
   'El cruce con matrículas confirma el corredor común. Falta saber qué pasó en ese corredor.',
   'Trescientas cuarenta gestiones individuales sobre una causa compartida.'),
  c('Establecer qué se daña en el resto del banco si se le cambian las condiciones a un sector entero de golpe.','bajo','contralto','fundamento',
   'Se identifica que la reestructuración masiva dispara una recalificación automática de todo el portafolio de transporte. Se aísla el subsegmento antes de mover nada.',

   'Se reestructura y ochocientos créditos sanos amanecen recalificados. La provisión del trimestre se triplica.'),
  c('Hacer que doscientas oficinas y el equipo de cobranza apliquen la nueva condición igual, cada uno con las palabras que su trabajo necesita.','baritono','bajo','tesitura',

 5:[

{id:'mesa',nombre:'Mesa de dinero',titulo:'Cuarenta minutos',ejeD:'agilidad',ejeS:'proyeccion',
 sit:'Son las siete de la mañana. Acaba de salir el dato de inflación y llegó mucho más alto de lo que todo el mundo esperaba, lo cual significa que unos títulos que el banco tiene guardados van a valer bastante menos cuando abra el mercado a las ocho. El equipo puede venderlos por su cuenta hasta las 7:40; después de esa hora, cualquier movimiento necesita la autorización de un directivo que todavía está durmiendo. Vender rápido puede evitar la pérdida, o puede alertar al mercado y hacerla peor. Esperar da mejor información y menos margen para usarla. Cuarenta minutos.',
 v:{
 3:[
  c('Decidir si se vende ahora, con información incompleta, o se espera a que abra el mercado.','mezzo','tenor','agilidad',
   'Se reduce a la mitad en veintidós minutos, en tres tramos, sin mover la curva. La otra mitad queda cubierta con lo que se alcanzó a renovar.',
   'Se cierra toda la posición de golpe a las 7:38. Se ejecuta. El precio del último tramo es peor y el mercado nota quién estaba vendiendo.',
   'Se decide esperar la apertura para tener más información. A las 8:14 la información es el precio.'),
  c('Despertar a un directivo para pedirle permiso de pasarse del límite autorizado.','tenor','mezzo','proyeccion',
   'Se llama al presidente del comité a las 7:50, sin presentación y sin correo previo. La excepción sale verbal a las 7:56 y por escrito a las 9:20.',
   'Se convoca comité extraordinario. Se reúne a las 9:10. La excepción llega correcta y una hora tarde.',
   'Nadie pide nada. La mesa opera el día entero dentro del límite, con la posición equivocada.'),
  c('Dejar por escrito por qué se saltaron la regla y hasta dónde vale ese permiso, antes de que alguien lo use el año entrante para otra cosa.','bajo','baritono','fundamento',
   'Se documenta la excepción con su fundamento y su fecha de vencimiento el mismo día. Cuando auditoría pregunta en septiembre, la respuesta ya está escrita.',
   'Se documenta a la semana siguiente, completo. El acta reconstruye lo que pasó con la memoria de tres personas.',
   'Queda una excepción sin registro y un precedente que otros usan en octubre para algo que no se parece.')],
 4:[
  c('Antes de reaccionar, averiguar si la cifra dice lo que todos creen que dice.','contralto','mezzo','escucha',
   'Alguien abre el desagregado y ve que sesenta de los ochenta puntos vienen de un rubro estacional que se revierte en el corte siguiente. La sorpresa es menor de lo que parece.',
   'Se revisa el desagregado y se confirma que el dato es sólido. El movimiento posterior se hace sobre información completa.',
   'Se opera contra el titular. El rubro se revierte en octubre y la posición se recompone dos veces.'),
  c('Decidir si se vende antes de las 7:40 o no se vende.','mezzo','baritono','agilidad',
   'Reducción a la mitad en tres tramos, veintidós minutos, sin mover la curva.',
   'Cierre total a las 7:38. Peor precio en el último tramo y una firma visible en el mercado.',
   'Se espera la apertura. A las 8:14 la información es el precio.'),
  c('Despertar a un directivo para pedirle permiso de pasarse del límite.','tenor','soprano','proyeccion',
   'Llamada a las 7:50, excepción verbal a las 7:56.',
   'Comité extraordinario a las 9:10. Correcto y tarde.',
   'La mesa opera el día dentro del límite con la posición equivocada.'),
  c('Dejar por escrito por qué se hizo la excepción y hasta dónde vale.','bajo','contralto','fundamento',
   'Fundamento y fecha de vencimiento, escritos el mismo día.',
   'Acta reconstruida a la semana con la memoria de tres personas.',
   'Un precedente sin registro que alguien invoca en octubre para algo distinto.')],
 5:[
  c('Decidir si se vende ahora, con información incompleta, o se espera a que abra el mercado.','mezzo','tenor','agilidad',
   'Mitad de la posición, tres tramos, veintidós minutos, sin mover la curva.',

{id:'core',nombre:'Migración del core',titulo:'Lo que sostiene el edificio',ejeD:'tesitura',ejeS:'fundamento',
 sit:'El sistema donde viven las cuentas de ahorro de cuatro millones de clientes se programó en 1998. Otros treinta y un sistemas dependen de él, incluidos dos que nadie recuerda haber construido. Hay que reemplazarlo sin apagar el banco: la gente sigue cobrando su sueldo, pagando servicios y sacando plata todos los días. Solo hay un fin de semana en el año con movimiento suficientemente bajo para hacer el cambio. Si sale mal, el lunes millones de personas abren la app y ven un saldo que no es el suyo. Las tres personas que entienden de verdad cómo funciona el sistema viejo se jubilan este año.',

{id:'quejas',nombre:'Patrón de quejas',titulo:'Lo que dicen cuando cuelgan',ejeD:'escucha',ejeS:'fundamento',
 sit:'Hace once meses que la encuesta del call center da resultados excelentes, y el área lo celebra en cada informe. La semana pasada, tres asesores de tres ciudades distintas comentaron por separado que los clientes de un producto cuelgan antes de que la encuesta termine. Ninguno lo reportó: les pareció un detalle. Si los que cuelgan son justamente los que están molestos, el indicador lleva casi un año midiendo paciencia y no satisfacción, y todas las decisiones tomadas con ese número se tomaron sobre un espejismo. Nadie ha hecho nada. Alguien lo mencionó en un almuerzo.',

{id:'brecha',nombre:'Brecha activa',titulo:'Cuarenta minutos de otra clase',ejeD:'agilidad',ejeS:'proyeccion',

/* ============ PENTAGRAMA ============ */
function staff(ejes,compacto){
  const W=compacto?128:230, H=compacto?58:74;
  const y0=compacto?7:9, dy=compacto?11:14;
  const xL=compacto?11:52, xR=compacto?W-6:W-24, xN=compacto?(xL+xR)/2:150;
  let s=`<svg class="staff" viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">`;
  EJES.forEach((e,i)=>{
    const y=y0+i*dy, v=ejes[e];
    s+=`<line class="linea" x1="${xL}" y1="${y}" x2="${xR}" y2="${y}"/>`;
    s+=compacto
      ? `<text class="et ${v===0?'et-cero':''}" x="0" y="${y+2.6}">${EJE_NOM[e][0]}</text>`
      : `<text class="et ${v===0?'et-cero':''}" x="0" y="${y+2.8}">${EJE_NOM[e]}</text>`;
    if(v===0){
      const w=compacto?9:11,h=compacto?4.2:5;
      s+=`<rect class="silencio" x="${xN-w/2}" y="${y-h}" width="${w}" height="${h}"/>`;
    }else{
      const rx=compacto?4.6:5.4, ry=compacto?3.3:3.9;
      if(v===3) s+=`<ellipse class="cabeza" cx="${xN}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-18 ${xN} ${y})"/>`;
      else if(v===2) s+=`<ellipse class="cabeza-hueca" cx="${xN}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-18 ${xN} ${y})" stroke-width="2.2"/>`;
      else s+=`<ellipse class="cabeza-hueca" cx="${xN}" cy="${y}" rx="${rx-1}" ry="${ry-.8}" transform="rotate(-18 ${xN} ${y})" stroke-width="1.1"/>`;
    }
    if(!compacto) s+=`<text class="et ${v===0?'et-cero':''}" x="${W-14}" y="${y+2.8}">${v===0?'—':v}</text>`;
  });
  return s+'</svg>';
}

function glifo(v){
  const W=26,H=16,y=8,x=13;
  let g='<svg class="staff glf" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  g+='<line class="linea" x1="1" y1="'+y+'" x2="'+(W-1)+'" y2="'+y+'"/>';
  if(v===0) g+='<rect class="silencio" x="'+(x-5.5)+'" y="'+(y-5)+'" width="11" height="5"/>';
  else if(v===3) g+='<ellipse class="cabeza" cx="'+x+'" cy="'+y+'" rx="5.4" ry="3.9" transform="rotate(-18 '+x+' '+y+')"/>';
  else if(v===2) g+='<ellipse class="cabeza-hueca" cx="'+x+'" cy="'+y+'" rx="5.4" ry="3.9" stroke-width="2.2" transform="rotate(-18 '+x+' '+y+')"/>';
  else g+='<ellipse class="cabeza-hueca" cx="'+x+'" cy="'+y+'" rx="4.4" ry="3.1" stroke-width="1.1" transform="rotate(-18 '+x+' '+y+')"/>';
  return g+'</svg>';
}

    <button class="ayuda" onclick="comoSeLee()">? Cómo se lee</button></div>
  <div class="gab-grid">${cards}</div>
  <p class="pie">Una voz es un registro, no un cuerpo. En Fond de l'Étang los sopranos eran niños de once años.</p>
  ${consulta?`<div style="margin-top:26px"><button class="btn" onclick="atrilSetup()">Volver al atril</button></div>`
   :(S.miVoz?`<div style="margin-top:26px"><button class="btn" onclick="codigo()">Ver mi código</button></div>`:'')}
  </div>`);
}

/* ============ 2 · FICHA ============ */
function perfilCuerpo(k){
  const v=VOCES[k];
  const filas=EJES.map(e=>{
    const n=v.ejes[e];
    return `<div class="lect ${n===0?'cero':''}">
      <span class="lect-g">${glifo(n)}</span>
      <span class="lect-c">
        <span class="lect-e">${EJE_NOM[e]}<b>${NIVEL[n]}</b></span>
        <span class="lect-d">${EJE_DEF[e]}</span>
      </span></div>`}).join('');
  return `
  <div class="bloque"><span class="rotulo">Su obsesión</span>
    <p style="font-family:'Fraunces',serif;font-size:1.24rem;line-height:1.34;margin:0">${esc(v.obs)}</p></div>

  <div class="bloque"><span class="rotulo">Cómo lidera</span><p style="margin:0">${esc(v.lidera)}</p></div>

  <div class="bloque">
    <div class="eje-cab"><span class="rotulo" style="margin:0">Su partitura</span>
      <button class="ayuda" onclick="comoSeLee('${k}')">? Cómo se lee</button></div>
    <div style="max-width:340px;margin:10px 0 4px">${staff(v.ejes,false)}</div>
    <div class="lectura">${filas}</div>
    <p class="pie"><strong>${EJE_NOM[v.cero]}</strong> es una pausa. En una partitura el silencio se escribe, ocupa tiempo, y no es lo mismo que no haber compuesto nada.</p></div>

  <div class="bloque entra"><span class="rotulo">Cuándo te toca entrar</span>
    <p style="font-size:.93rem;margin-bottom:9px;color:var(--tinta-suave)">Señales en un compás que llaman a esta voz. Búscalas en el enunciado antes de decidir quién entra.</p>
    <ul class="senales">${v.busca.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>

  <div class="bloque desafina"><span class="rotulo">Cuándo desafina</span><p style="margin:0">${esc(v.desafina)}</p></div>

  <div class="bloque"><span class="rotulo">Dónde rinde más</span><p style="margin:0 0 .7em">${esc(v.fuerte)}</p>
    <span class="rotulo" style="margin-top:14px">Dónde le cuesta</span><p style="margin:0">${esc(v.dificil)}</p></div>

  <div class="bloque"><span class="rotulo">Con quién afina</span>
    <div class="afina-lista">${v.afina.map(x=>`<span class="chip">${x}</span>`).join('')}</div>
    <p style="margin-top:11px">${esc(v.afinaTxt)}</p></div>`;
}

function ficha(k,modo){
  const v=VOCES[k], consulta=modo==='consulta';
  pinta(`<div class="aparece">
  <button class="btn fantasma" style="width:auto;padding:9px 15px;margin-bottom:20px" onclick="${consulta?"gabinete('consulta')":'gabinete()'}">← ${consulta?'Las seis voces':'El gabinete'}</button>
  <div class="ficha-cab"><h2>${v.n}</h2><div class="sub">${esc(v.sub)}</div></div>
  ${perfilCuerpo(k)}
  ${consulta?'':`<div style="margin-top:28px"><button class="btn" onclick="confirmarVoz('${k}')">Esta es mi voz</button></div>`}
  </div>`);
}

function confirmarVoz(k){
  const v=VOCES[k];
  abrirHoja(`<h3>${v.n}</h3>
  <p class="tarea-eco">Vas a quedar registrado como ${v.n} para todo el ejercicio. No se puede cambiar.</p>
  <button class="btn" onclick="fijarVoz('${k}')">Confirmar</button>
  <button class="btn fantasma" onclick="cerrarHoja()">Seguir mirando</button>`);
}
function fijarVoz(k){
  S.miVoz=k; S.miCodigo=VOCES[k].l+String(Math.floor(Math.random()*90)+10);
  cerrarHoja(); codigo();
}

/* ============ 3 · CÓDIGO ============ */
function codigo(){
  const v=VOCES[S.miVoz];
  pinta(`<div class="aparece">
  <span class="rotulo">Tu voz</span>
  <div class="codigo-grande mono">${S.miCodigo}</div>

  </div>
  <p class="pie">No mires la pantalla de nadie. Lo que hace funcionar esto es que el coro aparezca completo, de golpe, y no armado de a poco.</p>
  <div class="pauta-sep"></div>
  <p class="lead" style="margin-bottom:20px">Este es tu perfil completo. Tenlo abierto durante las piezas: cuando el coro discuta quién entra en cada compás, tu trabajo es reconocer si el compás te está llamando a ti.</p>
  ${perfilCuerpo(S.miVoz)}
  <div class="pauta-sep"></div>
  <div style="margin-top:8px">
    <button class="btn fantasma" onclick="atrilSetup()">Sostener la partitura</button>
    <button class="btn fantasma" onclick="preguntaFinal()">El coro ya terminó</button>
  </div></div>`);
}

/* ============ 4 · ATRIL ============ */
function atrilSetup(){
  S.esAtril=true;
  pinta(`<div class="aparece">
  <span class="rotulo">El atril</span>
  <h2>Desde aquí se opera el coro</h2>
  <p style="margin-top:12px">Tu voz ya está adentro. ¿Cuántos son en total, contándote?</p>
  <div class="tam-grid">${[3,4,5,6,7].map(t=>`<button class="tam-btn ${S.n===t?'on':''}" onclick="fijarN(${t})">${t}</button>`).join('')}</div>
  <button class="btn fantasma" style="margin-top:14px" onclick="irAConsulta()">Ver el perfil de las seis voces</button>
  <div id="zonaCodigos"></div></div>`);
  if(S.n) pintarCodigos();
}
function fijarN(t){S.n=t;S.borrador=[];S.coro=[{cod:S.miCodigo,voz:S.miVoz,atril:true}];atrilSetup();}
function guardarBorrador(){
  if(!S.n) return;
  S.borrador=Array.from({length:S.n-1},(_,i)=>{const e=document.getElementById('ci'+i);return e?e.value:''});
}
function irAConsulta(){guardarBorrador();gabinete('consulta');}

function pintarCodigos(){
  const faltan=S.n-1;
  document.getElementById('zonaCodigos').innerHTML=`
  <div class="pauta-sep"></div>
  <p>Pide los códigos en voz alta y digítalos.</p>
  <div class="cod-lista">
    <div class="cod-fila"><span class="num mono">01</span>
      <input class="cod-input fija" value="${S.miCodigo}" disabled>
      <span class="voz">tú</span></div>
    ${Array.from({length:faltan},(_,i)=>`
    <div class="cod-fila"><span class="num mono">${String(i+2).padStart(2,'0')}</span>
      <input class="cod-input" id="ci${i}" value="${(S.borrador[i]||'')}" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="—" oninput="revisarCodigo(${i})">
      <span class="voz" id="cv${i}"></span></div>`).join('')}
  </div>
  <p class="aviso" id="avisoCod"></p>
  <p class="pie">Si alguien dictó mal, corrígelo ahora. Después de dar el tono no se toca nada.</p>
  <div style="margin-top:22px"><button class="btn" id="btnTono" disabled onclick="confirmarTono()">Dar el tono</button></div>`;
  if(S.borrador.some(x=>x)) revisarCodigo(0);
}

function revisarCodigo(i){
  const el=document.getElementById('ci'+i); el.value=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const out=[]; let ok=true, msg='';
  for(let j=0;j<S.n-1;j++){
    const e=document.getElementById('ci'+j), val=e.value.trim(), lbl=document.getElementById('cv'+j);
    e.classList.remove('mala'); lbl.textContent='';
    if(val.length===0){ok=false;continue;}
    const voz=POR_LETRA[val[0]];
    if(val.length!==3||!voz||!/^\d\d$/.test(val.slice(1))){e.classList.add('mala');ok=false;msg='Un código es una letra y dos números. Revisa el '+(j+2)+'.';continue;}
    if(val===S.miCodigo||out.includes(val)){e.classList.add('mala');ok=false;msg='Ese código ya está en la lista. Pídelo otra vez.';continue;}
    out.push(val); lbl.textContent=VOCES[voz].n;
  }
  guardarBorrador();
  document.getElementById('avisoCod').textContent=msg;
  document.getElementById('btnTono').disabled=!ok;
  if(ok){S.coro=[{cod:S.miCodigo,voz:S.miVoz,atril:true}].concat(out.map(c=>({cod:c,voz:POR_LETRA[c[0]],atril:false})));}
}

function confirmarTono(){
  abrirHoja(`<h3>Dar el tono</h3>
  <p class="tarea-eco">El coro queda como está. Los códigos no se vuelven a tocar.</p>
  <button class="btn" onclick="cerrarHoja();armarCoro()">Dar el tono</button>
  <button class="btn fantasma" onclick="cerrarHoja()">Volver a revisar</button>`);
}

/* ============ 5 · RETRATO SONORO ============ */
const cobertura=()=>{const c={};EJES.forEach(e=>c[e]=0);S.coro.forEach(m=>EJES.forEach(e=>c[e]+=VOCES[m.voz].ejes[e]));return c;};

const RET_DOM={
 fundamento:'Este coro suena grave. El peso está abajo, en la línea que no se mueve, en la voz que llega tarde a entusiasmarse y nunca tiembla.',
 proyeccion:'Este coro se oye desde el fondo del salón. Hay volumen, hay cuerpo puesto adelante, hay gente dispuesta a que le vean la cara mientras habla.',
 escucha:'Este coro suena bajo de volumen y muy adentro. Registra la sala, la lee, sabe quién dejó de hablar en el minuto doce.',
 agilidad:'Este coro no se queda quieto. Cambia de línea a mitad de compás, cubre lo que se abra, absorbe el impacto con el cuerpo antes de que alguien lo nombre.',
 tesitura:'Este coro cubre mucho rango. Se mueve entre registros sin forzarse, traduce de un idioma a otro, hace que lo de arriba llegue abajo.'};
const RET_AUS={
 fundamento:'Debajo no hay nada sosteniendo: nadie en la sala sabe qué se rompe cuando esto avance.',
 proyeccion:'Nadie aquí sube el volumen: lo que este coro descubra va a quedarse en el cuarto donde lo descubrió.',
 escucha:'Nadie aquí se detiene a oír la sala: lo que no se diga en voz alta no va a existir para este coro.',
 agilidad:'Nadie aquí improvisa: si la partitura se rompe, este coro sigue en la nota que le tocaba.',
 tesitura:'Nadie aquí traduce: lo que se decida va a salir en un solo idioma y va a llegar a quien ya lo hablaba.'};

function retratoTexto(){
  const c=cobertura(), ord=EJES.slice().sort((a,b)=>c[b]-c[a]);
  const dom=ord[0], aus=ord[ord.length-1];
  const distintas=new Set(S.coro.map(m=>m.voz)).size;
  const dobles=Object.entries(S.coro.reduce((a,m)=>(a[m.voz]=(a[m.voz]||0)+1,a),{})).filter(([,n])=>n>1);
  let t3='';
  if(dobles.length){
    const nom=dobles.map(([v,n])=>`${n} ${VOCES[v].pl}`).join(' y ');
    t3=`Hay voces dobladas — ${nom} — y una voz doblada no suena más ancha: suena más fuerte en el mismo lugar.`;
  }else if(distintas===S.coro.length && distintas>=5){
    t3='No hay dos voces iguales. Cada línea de este coro la sostiene una sola persona.';
  }else{
    t3='Seis registros existen y este coro trajo '+distintas+'.';
  }
  return {dom,aus,html:`<span class="destacado">${RET_DOM[dom]}</span><p>${RET_AUS[aus]}</p><p>${t3}</p>`};
}

function armarCoro(){
  S.version = S.n<=4?3 : S.n<=6?4 : 5;
  elegirPiezas();
  const r=retratoTexto();
  pinta(`<div class="aparece">
  <span class="rotulo">Así suena este coro</span>
  <div class="retrato" style="margin-top:14px">${r.html}</div>
  <div class="aviso-regla tarde">
    <span class="rotulo">Antes de empezar</span>
    <p>En cada pieza hay menos compases que miembros. <strong>${S.n-S.version===1?'Uno de ustedes no va a cantar':S.n-S.version+' de ustedes no van a cantar'}.</strong> ${S.n-S.version===1?'Ustedes deciden quién':'Ustedes deciden quiénes'}.</p>
    <p>Quien quede fuera en una pieza entra obligatoriamente en la siguiente.</p>
  </div>
  <div style="margin-top:22px" class="tarde2"><button class="btn" onclick="abrirPieza()">Empezar la pieza primera</button></div>
  </div>`);
}

/* ============ 6 · SELECCIÓN DE PIEZAS ============ */
function elegirPiezas(){
  // terreno real: cuántos compases de esta versión puede cubrir el coro que hay
  const vocesCoro=new Set(S.coro.map(m=>m.voz));
  const puntaje=AMBITOS.map((a,i)=>{
    let p=0;
    a.v[S.version].forEach(x=>{
      if(vocesCoro.has(x.a)) p+=2;
      else if(vocesCoro.has(x.c)) p+=1;
    });
    return {i,p:p/a.v[S.version].length + Math.random()*.12};
  });
  puntaje.sort((x,y)=>y.p-x.p);
  const alta=puntaje[0].i, baja=puntaje[puntaje.length-1].i;
  const medio=puntaje.slice(1,-1).sort((x,y)=>Math.abs(x.p-1)-Math.abs(y.p-1))[0].i;
  S.piezas=[alta,medio,baja];
}

/* ============ 7 · PIEZA ============ */
const piezaActual=()=>{const a=AMBITOS[S.piezas[S.pIdx]];return{a,cs:a.v[S.version]};};
const ORD=['primera','segunda','tercera'];
const ROM=['I','II','III','IV','V'];

function abrirPieza(){S.asign={};pintarPieza();}

function pintarPieza(){
  const {a,cs}=piezaActual();
  const usados=Object.values(S.asign);
  const compases=cs.map((x,i)=>{
    const m=S.asign[i]!==undefined?S.coro[S.asign[i]]:null;
    return `<button class="compas ${m?'lleno':''}" onclick="abrirAsignar(${i})">
      <span class="cifra">${ROM[i]}</span>
      <span class="cuerpo"><span class="tarea">${esc(x.t)}</span>
      <span class="casilla mono">${m?m.cod+' · '+VOCES[m.voz].n:'sin asignar'}</span></span></button>`}).join('');
  const pool=S.coro.map((m,i)=>`<div class="tarjeta ${usados.includes(i)?'usada':''} ${m.atril?'atril':''}">
      <span>${m.cod}</span><span class="v">${VOCES[m.voz].n}</span></div>`).join('');
  const faltan=cs.length-usados.length, fuera=S.coro.length-usados.length;
  pinta(`<div class="aparece">
  <span class="rotulo">Pieza ${ORD[S.pIdx]} · ${a.nombre}</span>
  <h2 style="margin-top:6px">${a.titulo}</h2>
  <div class="situacion">${esc(a.sit)}</div>
  <p style="font-size:.95rem">${cs.length} compases, ${S.coro.length} voces. Toca un compás y elige quién entra.</p>
  <p class="pie" style="margin:12px 0 20px">Nadie entra dos veces. Un compás vacío se cuenta como silencio.<br><strong>${S.coro[0].cod}</strong> no puede asignarse a sí mismo: otro tiene que decir dónde va.</p>
  ${compases}
  <div class="pool"><span class="rotulo">El coro</span><div class="pool-grid">${pool}</div>
    <div class="contador">${faltan>0?`Faltan ${faltan} compases por llenar`:`Quedan ${fuera} sin entrar`}</div></div>
  <div style="margin-top:24px"><button class="btn" ${faltan>0?'disabled':''} onclick="confirmarInterpretar()">Interpretar la pieza</button></div>
  <p class="aviso" id="avisoRot"></p></div>`);
}

function abrirAsignar(ci){
  const {cs}=piezaActual(); S.compasAbierto=ci;
  const usados=Object.values(S.asign);
  const yaAqui=S.asign[ci];
  const ops=S.coro.map((m,i)=>{
    if(usados.includes(i)&&i!==yaAqui) return '';
    if(m.atril) return `<button class="op bloq" onclick="pedirPermisoAtril(${i})"><span>${m.cod}</span><span class="vz">alguien más tiene que decirlo</span></button>`;
    return `<button class="op" onclick="asignar(${i})"><span>${m.cod}</span><span class="vz">${VOCES[m.voz].n}</span></button>`}).join('');
  abrirHoja(`<h3>Compás ${ROM[ci]}</h3><p class="tarea-eco">${esc(cs[ci].t)}</p>${ops}
    ${yaAqui!==undefined?`<button class="btn fantasma" style="margin-top:10px" onclick="quitar(${ci})">Sacar a ${S.coro[yaAqui].cod} de este compás</button>`:''}`);
}
function asignar(i){S.asign[S.compasAbierto]=i;cerrarHoja();pintarPieza();}
function quitar(ci){delete S.asign[ci];cerrarHoja();pintarPieza();}
function pedirPermisoAtril(i){
  abrirHoja(`<h3>${S.coro[i].cod}</h3>
  <p class="tarea-eco">Sostienes la partitura. No decides dónde entras. ¿Otro miembro del coro dijo que entras en este compás?</p>
  <button class="btn" onclick="asignar(${i})">Sí, alguien lo dijo</button>
  <button class="btn fantasma" onclick="abrirAsignar(${S.compasAbierto})">Todavía no</button>`);
}

function confirmarInterpretar(){
  // rotación
  const usados=Object.values(S.asign);
  const fuera=S.coro.filter((m,i)=>!usados.includes(i)).map(m=>m.cod);
  const repite=fuera.filter(c=>S.fueraPrev.includes(c));
  if(repite.length){
    document.getElementById('avisoRot').textContent=`${repite.join(', ')} ya quedó fuera en la pieza anterior y tiene que entrar en esta.`;
    return;
  }
  abrirHoja(`<h3>Interpretar</h3>
  <p class="tarea-eco">Se interpreta una sola vez. No hay repetición.</p>
  <button class="btn" onclick="cerrarHoja();evaluar()">Interpretar</button>
  <button class="btn fantasma" onclick="cerrarHoja()">Volver a mover</button>`);
}

/* ============ 8 · EVALUACIÓN ============ */
function evaluar(){
  const {a,cs}=piezaActual();
  const vocesCoro=S.coro.map(m=>m.voz);
  const usados=Object.values(S.asign);
  const filas=cs.map((x,i)=>{
    const idx=S.asign[i], m=idx!==undefined?S.coro[idx]:null;
    let estado, disp=null;
    if(m&&m.voz===x.a) estado='afinado';
    else if(m&&m.voz===x.c) estado='casi';
    else if(vocesCoro.includes(x.a)){estado='noentro';disp=x.a;}
    else if(vocesCoro.includes(x.c)){estado='noentro';disp=x.c;}
    else estado='silencio';
    const cons= estado==='afinado'?x.ok : estado==='casi'?x.mid : x.no;
    return {i,estado,disp,cons,quien:m?m.cod+' · '+VOCES[m.voz].n:'nadie entró',afina:x.a,casi:x.c,eje:x.e,tarea:x.t,pieza:S.pIdx};
  });
  S.hist.push({ambito:a,filas});
  S.fueraPrev=S.coro.filter((m,i)=>!usados.includes(i)).map(m=>m.cod);
  resultado();
}

const ETIQ={afinado:'Afinado',casi:'Casi en tono',noentro:'La voz estaba y no entró',silencio:'Silencio'};

function resultado(){
  const {ambito,filas}=S.hist[S.hist.length-1];
  const cuerpo=filas.map(f=>`
    <div class="res ${f.estado}">
      <div class="enc"><span class="cf">Compás ${ROM[f.i]}</span><span class="estado">${ETIQ[f.estado]}</span></div>
      <div class="quien">${esc(f.quien)}</div>
      <p class="cons">${esc(f.cons)}</p>
    </div>`).join('');

  const af=filas.filter(f=>f.estado==='afinado');
  const fl=filas.filter(f=>f.estado!=='afinado');
  let bien='';
  if(af.length){
    bien=`<div class="capa"><h3>Lo que afinó</h3><div class="cuerpo">`+
      af.map(f=>`<p><span class="cf mono">Compás ${ROM[f.i]} · ${EJE_NOM[f.eje]}</span><br>${esc(LECCION[f.eje].bien)}</p>`).join('')+
      `</div></div>`;
  }else{
    bien=`<div class="capa"><h3>Lo que afinó</h3><div class="cuerpo"><p>Ningún compás quedó afinado en esta pieza. Eso no significa que el coro esté mal armado: significa que este problema le pedía registros que no tenía a la mano, o que los tenía en otro lugar.</p></div></div>`;
  }
  const mejor=fl.length?`<div class="capa"><h3>Cómo afinar mejor</h3><div class="cuerpo">`+
    fl.map(f=>`<p><span class="cf mono">Compás ${ROM[f.i]} · ${EJE_NOM[f.eje]}</span><br>${esc(LECCION[f.eje].pide)} ${esc(porQue(f.eje,f.afina))}</p>
      <p class="consejo">${esc(LECCION[f.eje].consejo)}</p>`).join('')+
    `</div></div>`:'';

  const ultima=S.pIdx===2;
  pinta(`<div class="aparece">
  <span class="rotulo">Cómo sonó la pieza ${ORD[S.pIdx]}</span>
  <h2 style="margin:6px 0 22px">${ambito.titulo}</h2>
  ${cuerpo}
  <div class="pauta-sep"></div>
  ${bien}${mejor}
  <p class="pie">El balance completo de las tres piezas llega al final.</p>
  <div style="margin-top:26px"><button class="btn" onclick="${ultima?'diagnostico()':'siguientePieza()'}">${ultima?'Cómo sonó el coro':'Pieza '+ORD[S.pIdx+1]}</button></div>
  </div>`);
}
function siguientePieza(){S.pIdx++;abrirPieza();}

/* ============ 9 · CÓMO SONÓ ============ */
function diagnostico(){
  const todas=S.hist.flatMap(h=>h.filas);
  const vocesCoro=[...new Set(S.coro.map(m=>m.voz))];
  const ausentes=ORDEN_VOCES.filter(v=>!vocesCoro.includes(v));
  const af=todas.filter(f=>f.estado==='afinado');
  const cas=todas.filter(f=>f.estado==='casi');
  const ne=todas.filter(f=>f.estado==='noentro');
  const sil=todas.filter(f=>f.estado==='silencio');

  /* --- las tres piezas --- */
  const recap=S.hist.map((h,p)=>{
    const a=h.filas.filter(f=>f.estado==='afinado').length;
    const flojo=h.filas.filter(f=>f.estado!=='afinado');
    const eje=flojo.length?EJE_NOM[flojo[0].eje]:null;
    return `<div class="recap">
      <div class="recap-t"><span class="cf mono">Pieza ${ORD[p]}</span><span class="cf mono">${a}/${h.filas.length} afinados</span></div>
      <div class="recap-n">${h.ambito.titulo}</div>
      <div class="recap-d">${a===h.filas.length?'Este coro estaba hecho para este problema.':(eje?'Donde primero cedió: '+eje+'.':'')}</div>
    </div>`}).join('');

  /* --- lo que sostuvo --- */
  const porVoz={};
  af.forEach(f=>{const v=f.quien.split(' · ')[1]; if(v) porVoz[v]=(porVoz[v]||0)+1});
  const rank=Object.entries(porVoz).sort((a,b)=>b[1]-a[1]);
  const ejesAf=[...new Set(af.map(f=>f.eje))];
  let c1;
  if(af.length){
    c1=`<p><strong>${af.length} de ${todas.length} compases ${af.length===1?'quedó afinado':'quedaron afinados'}</strong>, ${casiFrase(cas.length)}${cas.length?': una voz que no era la ideal hizo el trabajo igual, con un costo que la organización absorbió.':'.'}</p>
    <p>${rank.map(r=>`<strong>${r[0]}</strong> sostuvo ${r[1]}`).join(', ')}. ${rank.length>1?'Ninguna de esas voces habría podido cubrir sola lo que cubrieron entre todas.':'Ese peso lo cargó una sola voz, y eso también es un dato: un coro que depende de un registro se queda mudo el día que esa persona no está.'}</p>
    <p>Los ejes que este coro sí supo cubrir: ${ejesAf.map(e=>EJE_NOM[e]).join(', ')}. Un equipo que los cubre rinde en ${ejesAf.map(e=>esc(LECCION[e].rinde)).join('; y en ')}.</p>`;
  }else{
    c1=`<p>Ningún compás quedó afinado, ${casiFrase(cas.length)}${cas.length?', lo cual quiere decir que alguien hizo el trabajo sin ser la voz indicada':''}. Eso pasa todos los días en las organizaciones reales y tiene un costo que nadie factura: se resuelve, y se resuelve peor.</p>
    <p>Vale la pena mirar el reparto antes de concluir nada: un coro de este tamaño no puede cubrir seis registros, y lo que aquí se ve como fracaso suele ser la forma del equipo y no la calidad de su gente.</p>`;
  }

  /* --- cómo se resolvía --- */
  const fallos=todas.filter(f=>f.estado!=='afinado');
  const porEje={};
  fallos.forEach(f=>{(porEje[f.eje]=porEje[f.eje]||[]).push(f)});
  const ordEje=Object.keys(porEje).sort((a,b)=>porEje[b].length-porEje[a].length);
  let c2;
  if(!fallos.length){
    c2='<p>Los tres problemas se resolvieron con la voz que cada compás pedía. Este coro no solo tenía los registros: supo dónde ponerlos, que es la parte difícil.</p>';
  }else{
    c2=ordEje.slice(0,3).map(e=>{
      const fs=porEje[e], vozIdeal=fs[0].afina;
      const donde=fs.map(f=>`pieza ${ORD[f.pieza]}, compás ${ROM[f.i]}`).join('; ');
      return `<p><strong style="font-family:'Fraunces',serif;font-size:1.14rem">${EJE_NOM[e]}</strong> — ${fs.length} ${fs.length===1?'compás':'compases'}</p>
      <p>${esc(LECCION[e].pide)} ${esc(porQue(e,vozIdeal))}</p>
      <p class="consejo">${esc(LECCION[e].consejo)}</p>
      <p class="marca">${donde}</p>`}).join('<div class="pauta-sep"></div>');
  }

  /* --- la voz ausente --- */
  const pedidas={};
  todas.forEach(f=>{if(ausentes.includes(f.afina))(pedidas[f.afina]=pedidas[f.afina]||[]).push(f)});
  const ordA=Object.keys(pedidas).sort((a,b)=>pedidas[b].length-pedidas[a].length);
  let c3;
  if(!ordA.length){
    c3='<p>Todas las obsesiones que los tres problemas reclamaron estaban en la sala. Lo que este coro perdió, si perdió algo, lo perdió por asignación y no por ausencia — y eso se corrige en una conversación, no en una contratación.</p>';
  }else{
    c3=ordA.slice(0,2).map(v=>{
      const V=VOCES[v], fs=pedidas[v];
      return `<p><strong style="font-family:'Fraunces',serif;font-size:1.15rem">${V.n}</strong> no estuvo. Nadie entró a la sala con esta pregunta encima: <em>${esc(V.obs).toLowerCase().replace(/\.$/,'')}</em>.</p>
      <p>${esc(V.falta)}</p>
      <p>Lo que aporta: ${minus(esc(V.fuerte))}</p>
      <p class="marca">Reclamada en ${fs.length} ${fs.length===1?'compás':'compases'}</p>`}).join('<div class="pauta-sep"></div>');
  }

  /* --- para qué está hecho este coro --- */
  const cob={}; EJES.forEach(e=>cob[e]=0);
  S.coro.forEach(m=>EJES.forEach(e=>cob[e]+=VOCES[m.voz].ejes[e]));
  const ordC=EJES.slice().sort((a,b)=>cob[b]-cob[a]);
  const fuertes=vocesCoro.map(v=>VOCES[v]).sort((a,b)=>b.ejes[ordC[0]]-a.ejes[ordC[0]])[0];
  const debil=ORDEN_VOCES.find(v=>VOCES[v].ejes[ordC[4]]===3);
  const c4=`<p>El peso de este coro está en <strong>${EJE_NOM[ordC[0]]}</strong> y su punto más delgado es <strong>${EJE_NOM[ordC[4]]}</strong>. Con esa forma rinde en ${esc(LECCION[ordC[0]].rinde)}.</p>
  <p>Le van a costar ${esc(LECCION[ordC[4]].terreno)}. Ahí este coro llega tarde, o llega y resuelve otra cosa.</p>
  <p class="consejo">${esc(LECCION[ordC[4]].consejo)}</p>
  <p>Cuando armes un equipo para un problema de esa clase, busca a alguien con perfil de <strong>${VOCES[debil].n}</strong>, y ponlo en el compás donde se decide, no en el que se ejecuta.</p>`;

  pinta(`<div class="aparece">
  <span class="rotulo">Cómo sonó</span>
  <h1 style="font-size:1.9rem;margin:6px 0 4px">Tres piezas, ${todas.length} compases</h1>
  <div class="recaps">${recap}</div>
  <div class="capa"><h3>Lo que sostuvo el coro</h3><div class="cuerpo">${c1}</div></div>
  <div class="capa"><h3>Cómo se resolvía lo demás</h3><div class="cuerpo">${c2}</div></div>
  <div class="capa"><h3>La voz que no estuvo en la sala</h3><div class="cuerpo">${c3}</div></div>
  <div class="capa"><h3>Para qué está hecho este coro</h3><div class="cuerpo">${c4}</div></div>
  <div class="pauta-sep"></div>
  <p class="pie">Cada uno tiene una última pantalla en su propio teléfono, distinta según su voz.</p>
  <div style="margin-top:22px"><button class="btn fantasma" onclick="preguntaFinal()">Ir a mi última pantalla</button></div>
  </div>`);
}

/* ============ 10 · TU PARTITURA DE AQUÍ EN ADELANTE ============ */
function preguntaFinal(){
  if(!S.miVoz){pinta(`<div class="aparece"><span class="rotulo">Fin</span><h2>El coro terminó</h2><p style="margin-top:14px">Esta pantalla se arma con la voz que elegiste al principio. Si estás llegando aquí sin haber elegido, vuelve al gabinete.</p><div style="margin-top:22px"><button class="btn" onclick="gabinete()">Abrir el gabinete</button></div></div>`);return;}
  const v=VOCES[S.miVoz];
  pinta(`<div class="aparece">
  <span class="rotulo">Tu partitura de aquí en adelante</span>
  <h1 style="font-size:2rem;margin:6px 0 8px">${v.n}</h1>
  <p style="font-style:italic;color:var(--grafito)">${esc(v.sub)}</p>
  <div class="pauta-sep"></div>

  <div class="capa"><h3>Dónde rindes más</h3><div class="cuerpo"><p>${esc(v.fuerte)}</p>
    <p>Cuando te asignen un problema de esta clase, no lo delegues: es donde tu manera de trabajar vale más que la de cualquier otro en la sala.</p></div></div>

  <div class="capa"><h3>Dónde te va a costar</h3><div class="cuerpo"><p>${esc(v.dificil)}</p>
    <p>Aquí la jugada no es esforzarte más. Es reconocer el terreno a tiempo y traer a alguien: ${v.afina.map(x=>`<strong>${x}</strong>`).join(', ')}.</p></div></div>

  <div class="capa"><h3>Lo que puedes cultivar</h3><div class="cuerpo"><p>${esc(v.cultiva)}</p></div></div>

  <div class="capa"><h3>Tres prácticas para volverlo costumbre</h3><div class="cuerpo">
    <ol class="practicas">${v.practica.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
    <p class="consejo">Elige una sola de las tres y sostenla ocho semanas. Las tres a la vez no se sostienen, y una sola, sostenida, cambia cómo te ve tu equipo.</p></div></div>

  <div class="pauta-sep"></div>
  <div class="cierre-q">
    <p style="margin-bottom:6px">Antes de cerrar.</p>
    <div class="q">¿La voz que elegiste<br>fue la que usaste?</div>
    <p style="color:var(--grafito);font-size:.9rem;font-style:italic">No hay dónde responder. No hay pantalla siguiente.</p>
  </div>
  </div>`);
}

/* ============ REINICIO ============ */
function pedirReinicio(){
  abrirHoja(`<h3>Reiniciar el ejercicio</h3>
  <p class="tarea-eco">Se borra tu voz, tu código y el coro que esté armado. No hay manera de recuperarlo.</p>
  <p style="font-size:.95rem;margin-bottom:16px">Antes de tocar el botón, asegúrate de que <strong>todos los del grupo reinicien también</strong>. Si unos reinician y otros no, los códigos dejan de coincidir y el coro queda desarmado a mitad de pieza.</p>
  <button class="btn rojo" onclick="reiniciar()">Reiniciar para todos</button>
  <button class="btn fantasma" onclick="cerrarHoja()">Volver</button>`);
}
function reiniciar(){
  Object.assign(S,{miVoz:null,miCodigo:null,esAtril:false,n:0,coro:[],version:3,piezas:[],pIdx:0,asign:{},fueraPrev:[],hist:[],compasAbierto:null,borrador:[]});
  cerrarHoja(); entrada();
}

/* ============ HOJA ============ */
function abrirHoja(h){hoja.innerHTML=h;hoja.classList.add('on');velo.classList.add('on');}
function cerrarHoja(){hoja.classList.remove('on');velo.classList.remove('on');}

entrada();

</script>
